<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Лера</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #0b1026;
    --navy-deep: #060814;
    --gold: #f0c987;
    --rose: #e8a0bf;
    --cream: #faf6f0;
    --plum: #5c2a4d;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    width:100%;
    height:100%;
    height:100dvh;
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    background: radial-gradient(ellipse at 50% 20%, var(--navy) 0%, var(--navy-deep) 75%);
    font-family:'Jost', sans-serif;
    color: var(--cream);
  }

  .sky{
    position:fixed;
    inset:0;
    overflow:hidden;
  }

  /* ambient twinkling stars */
  .star{
    position:absolute;
    background: var(--cream);
    border-radius:50%;
    opacity:0.2;
    animation: twinkle linear infinite;
  }

  @keyframes twinkle{
    0%, 100%{ opacity:0.15; }
    50%{ opacity:0.9; }
  }

  /* drifting fireflies */
  .firefly{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background: var(--gold);
    box-shadow: 0 0 8px 2px var(--gold);
    opacity:0;
    animation: drift linear infinite;
  }

  @keyframes drift{
    0%{ transform: translateY(20px) translateX(0); opacity:0; }
    10%{ opacity:0.8; }
    90%{ opacity:0.6; }
    100%{ transform: translateY(-100vh) translateX(30px); opacity:0; }
  }

  /* shooting stars */
  .shooting-star{
    position:fixed;
    width:2px;
    height:2px;
    border-radius:50%;
    background: var(--cream);
    top:0;
    left:0;
    opacity:0;
    z-index:2;
  }

  .shooting-star::before{
    content:'';
    position:absolute;
    top:50%;
    right:0;
    width:90px;
    height:1px;
    background: linear-gradient(to left, var(--cream), transparent);
    transform: translateY(-50%);
  }

  @keyframes shoot{
    0%{ opacity:0; transform: translate(0,0); }
    5%{ opacity:1; }
    75%{ opacity:0.9; }
    100%{ opacity:0; transform: translate(var(--dx), var(--dy)); }
  }

  /* soft breathing glow behind the constellation */
  .heart-glow{
    position:absolute;
    top:50%;
    left:50%;
    width: min(70vw, 56dvh, 480px);
    height: min(70vw, 56dvh, 480px);
    transform: translate(-50%,-50%);
    border-radius:50%;
    background: radial-gradient(circle, rgba(232,160,191,0.28) 0%, rgba(232,160,191,0.08) 45%, transparent 72%);
    opacity:0;
    animation: glowIn 2s ease-out forwards 2.6s, heartbeat 3.6s ease-in-out infinite 4.6s;
    filter: blur(2px);
    pointer-events:none;
  }

  @keyframes glowIn{
    to{ opacity:1; }
  }

  @keyframes heartbeat{
    0%, 100%{ transform: translate(-50%,-50%) scale(1); }
    12%{ transform: translate(-50%,-50%) scale(1.07); }
    22%{ transform: translate(-50%,-50%) scale(0.99); }
    32%{ transform: translate(-50%,-50%) scale(1.05); }
    45%{ transform: translate(-50%,-50%) scale(1); }
  }

  .constellation{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:min(88vw, 70dvh, 620px);
    height:min(88vw, 70dvh, 620px);
    pointer-events:none;
  }

  .constellation path{
    fill:none;
    stroke: var(--rose);
    stroke-width:1.2;
    stroke-linecap:round;
    opacity:0.55;
    stroke-dasharray: 1400;
    stroke-dashoffset: 1400;
    animation: draw 4.5s ease-out forwards 0.6s,
               lineGlow 3.6s ease-in-out infinite 5.1s;
  }

  @keyframes draw{
    to{ stroke-dashoffset:0; }
  }

  @keyframes lineGlow{
    0%, 100%{ opacity:0.5; filter: drop-shadow(0 0 0px var(--rose)); }
    18%{ opacity:0.9; filter: drop-shadow(0 0 6px var(--rose)); }
    35%{ opacity:0.55; filter: drop-shadow(0 0 0px var(--rose)); }
  }

  .constellation circle{
    fill: var(--gold);
    opacity:0;
    animation: pop 0.6s ease-out forwards;
  }

  .content{
    position:relative;
    z-index:5;
    height:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 0 24px;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .name{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size: clamp(2.6rem, 9vw, 5.5rem);
    letter-spacing: 0.04em;
    display:flex;
    gap:0.02em;
    background: linear-gradient(100deg,
      var(--cream) 30%, var(--gold) 45%, var(--cream) 60%);
    background-size: 300% 100%;
    background-position: 100% 0;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 5s ease-in-out infinite 3.2s;
  }

  @keyframes shimmer{
    0%, 55%, 100%{ background-position: 100% 0; }
    75%{ background-position: 0% 0; }
  }

  .name span{
    opacity:0;
    transform: translateY(14px);
    animation: letterIn 0.7s cubic-bezier(.2,.8,.2,1) forwards;
  }

  .heartline{
    margin-top: 22px;
    font-size: clamp(0.75rem, 2vw, 0.85rem);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    opacity:0;
    animation: fadeUp 1.2s ease-out forwards;
    animation-delay: 2.4s;
  }

  .hint{
    position:absolute;
    bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    left:50%;
    transform: translateX(-50%);
    font-size: 0.78rem;
    letter-spacing: 0.15em;
    color: var(--cream);
    opacity:0;
    animation: fadeUp 1.2s ease-out forwards, pulseHint 2.6s ease-in-out infinite 4.5s;
    animation-delay: 4s;
    text-align:center;
    padding: 0 20px;
    width: 100%;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:0.85; transform: translateY(0); }
  }

  @keyframes pulseHint{
    0%,100%{ opacity:0.4; }
    50%{ opacity:0.9; }
  }

  @keyframes letterIn{
    to{ opacity:1; transform: translateY(0); }
  }

  @keyframes pop{
    to{ opacity:1; }
  }

  /* click-spawned hearts */
  .burst-heart{
    position:fixed;
    pointer-events:none;
    z-index:10;
    width:16px;
    height:16px;
    animation: burst 1.6s ease-out forwards;
  }

  @keyframes burst{
    0%{ transform: translate(-50%,-50%) scale(0.4); opacity:1; }
    70%{ opacity:0.9; }
    100%{ transform: translate(-50%,-160%) scale(1.1); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .star, .firefly, .constellation path, .constellation circle,
    .name, .name span, .heartline, .hint, .heart-glow, .shooting-star{
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>

<div class="sky" id="sky">
  <div class="heart-glow"></div>
  <svg class="constellation" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M100,60 C80,35 40,45 40,80 C40,110 70,130 100,155 C130,130 160,110 160,80 C160,45 120,35 100,60 Z"/>
    <circle cx="100" cy="60" r="2.4" style="animation-delay:0.7s"/>
    <circle cx="40" cy="80" r="2.2" style="animation-delay:1.6s"/>
    <circle cx="70" cy="130" r="2" style="animation-delay:2.4s"/>
    <circle cx="100" cy="155" r="2.6" style="animation-delay:3s"/>
    <circle cx="130" cy="130" r="2" style="animation-delay:2.7s"/>
    <circle cx="160" cy="80" r="2.2" style="animation-delay:1.9s"/>
    <circle cx="120" cy="35" r="1.8" style="animation-delay:1.2s"/>
  </svg>
</div>

<div class="content">
  <h1 class="name" id="name" aria-label="Лера"></h1>
  <p class="heartline">я тебя люблю</p>
  <p class="hint">нажми в любом месте неба ✦</p>
</div>

<script>
  // letter-by-letter name reveal
  const nameEl = document.getElementById('name');
  const name = 'Лера';
  [...name].forEach((ch, i) => {
    const span = document.createElement('span');
    span.textContent = ch;
    span.style.animationDelay = (0.3 + i * 0.14) + 's';
    nameEl.appendChild(span);
  });

  // background stars
  const sky = document.getElementById('sky');
  const starCount = window.innerWidth < 600 ? 60 : 110;
  for (let i = 0; i < starCount; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 0.6;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (2 + Math.random() * 4) + 's';
    s.style.animationDelay = (Math.random() * 4) + 's';
    sky.appendChild(s);
  }

  // fireflies
  const fireflyCount = window.innerWidth < 600 ? 10 : 18;
  for (let i = 0; i < fireflyCount; i++) {
    const f = document.createElement('div');
    f.className = 'firefly';
    f.style.left = Math.random() * 100 + 'vw';
    f.style.animationDuration = (8 + Math.random() * 10) + 's';
    f.style.animationDelay = (Math.random() * 10) + 's';
    sky.appendChild(f);
  }

  // occasional shooting stars streaking across the sky
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function spawnShootingStar(){
    const star = document.createElement('div');
    star.className = 'shooting-star';
    const startX = Math.random() * window.innerWidth * 0.7 + window.innerWidth * 0.15;
    const startY = Math.random() * window.innerHeight * 0.3;
    const dx = -(120 + Math.random() * 160);
    const dy = 90 + Math.random() * 120;
    const duration = 1 + Math.random() * 0.6;
    star.style.left = startX + 'px';
    star.style.top = startY + 'px';
    star.style.setProperty('--dx', dx + 'px');
    star.style.setProperty('--dy', dy + 'px');
    star.style.animation = `shoot ${duration}s ease-in forwards`;
    document.body.appendChild(star);
    setTimeout(() => star.remove(), duration * 1000 + 100);
  }

  function scheduleShootingStars(){
    if (prefersReducedMotion) return;
    const delay = 5000 + Math.random() * 6000;
    setTimeout(() => {
      spawnShootingStar();
      scheduleShootingStars();
    }, delay);
  }
  scheduleShootingStars();

  // click / tap heart burst
  function spawnHeart(x, y){
    const h = document.createElement('div');
    h.className = 'burst-heart';
    h.style.left = x + 'px';
    h.style.top = y + 'px';
    h.innerHTML = `<svg viewBox="0 0 32 29" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 29 C16 29 0 18.5 0 8.8 C0 2.9 4.6 0 9 0 C12.2 0 14.8 1.9 16 4.6 C17.2 1.9 19.8 0 23 0 C27.4 0 32 2.9 32 8.8 C32 18.5 16 29 16 29 Z"
        fill="${Math.random() > 0.5 ? '#e8a0bf' : '#f0c987'}"/>
    </svg>`;
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 1700);
  }

  window.addEventListener('pointerdown', (e) => {
    spawnHeart(e.clientX, e.clientY);
  });
</script>

</body>
</html>
